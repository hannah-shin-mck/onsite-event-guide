  <script>
    (function () {
      var safeProtocols = { "mailto:": true, "tel:": true, "data:": true, "blob:": true };

      function parseUrl(rawUrl) {
        try {
          return new URL(String(rawUrl || ""), window.location.href);
        } catch (error) {
          return null;
        }
      }

      function isSafeUrl(rawUrl) {
        var url = parseUrl(rawUrl);
        if (!url) return true;
        return url.origin === window.location.origin || safeProtocols[url.protocol] === true;
      }

      function blockExternalUrl(rawUrl) {
        if (!rawUrl || isSafeUrl(rawUrl)) return false;
        window.__blockedExternalUrl = parseUrl(rawUrl).href;
        try {
          window.dispatchEvent(new CustomEvent("lovable-external-navigation-blocked", {
            detail: { url: window.__blockedExternalUrl }
          }));
        } catch (error) {}
        return true;
      }

      var originalOpen = window.open;
      window.open = function (url, target, features) {
        if (url !== undefined && blockExternalUrl(url)) return null;
        return originalOpen.call(window, url, target, features);
      };

      document.addEventListener("click", function (event) {
        var target = event.target;
        if (!target || !target.closest) return;
        var anchor = target.closest("a[href]");
        if (!anchor) return;
        var href = anchor.getAttribute("href");
        if (!href || href.charAt(0) === "#" || !blockExternalUrl(href)) return;
        event.preventDefault();
        event.stopPropagation();
        event.stopImmediatePropagation();
      }, true);
    })();
  </script>
